# Livraison continue : à chaque tag de version (ex. v1.1.0, créé sur main après une release GitFlow)
# → tests, puis image Docker publiée sur GitHub Container Registry, puis Release GitHub
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/ci.yml

  image:
    name: Publier l'image Docker
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write    # créer la Release GitHub
      packages: write    # publier sur ghcr.io
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Connexion à GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # jeton fourni par GitHub, aucun secret à créer

      - name: Tags de l'image (Semantic Versioning)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/giovanni-gozzo/poject_induscloudia
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build et publication
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Créer la Release GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
